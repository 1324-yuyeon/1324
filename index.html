<body><main class="shell">
  <header class="top"><div class="brand">A story about poverty and opportunity</div><div class="small" id="counter">A choice-based story</div></header>
  <div class="art" id="art" aria-hidden="true"></div>
  <div class="progress"><span id="progress"></span></div>
  <section class="card" aria-live="polite"><h1 id="title">Service Project, 1324 Park Yuyeon</h1><div class="story" id="story"></div><div class="status" id="status"></div><p class="prompt" id="prompt"></p><div class="choices" id="choices"></div><div class="response" id="response"></div></section>
  <footer class="footer">An interactive story about the choices poverty can leave out of reach.</footer>
</main>
<script>
const SCENES=[{"kind":"start","heading":"AGE 0 | The day Lui is born","story":"Lui is born in a community outside Bor, Jonglei State. His parents are glad he is healthy, but their income from small jobs and market trade changes from week to week. The nearest clinic is a long trip, and transport costs compete with food and medicine.\n\nHis parents want him to grow safely. They know one illness or missed paycheck can make even basic needs difficult to afford.\n\nAt the clinic, a nurse writes Lui's name in a small health booklet. His mother traces the letters with one finger, as if learning them will help keep him safe. His father folds the booklet into the family's most careful bag; there are few things they can afford to lose.","options":[["A community health worker visits the family.",{"Health":1,"Hope":1,"Community":1},"The visit provides advice about newborn care and vaccinations. One visit cannot remove every barrier, but early support gives Lui a stronger start."],["His parents set aside what they can for food and transport.",{"Food":1,"Family income":-1},"The family prepares for the next few days. Saving for care means less money for another need, so the trade-offs continue."]]},{"kind":"start","heading":"AGE 0 | First nights at home","story":"Lui wakes often, and his parents take turns soothing him. His mother is recovering from birth while worrying about missing work. The family needs rest, nutrition, and postnatal care, but each can be harder to arrange when money and transport are limited.","options":[["A nurse checks on both Lui and his mother.",{"Health":1,"Community":1},"The visit catches a feeding concern early and gives his mother a chance to ask questions."],["A relative stays overnight to help.",{"Hope":1,"Family income":-1},"His mother gets some rest, although the relative gives up time they could have spent earning income."]]},{"kind":"start","heading":"AGE 0 | The first health booklet","story":"At a follow-up visit, Lui receives a health booklet for vaccinations and growth checks. His parents keep it safe beside their important papers. The clinic is open only on certain days, and one missed work shift can mean losing pay.","options":[["Plan clinic visits around a community outreach day.",{"Health":1,"Community":1},"A nearby outreach day reduces the travel burden for the family."],["Wait until his father has a free day to travel.",{"Family income":1,"Health":-1},"His father keeps his work shift, but Lui's next checkup is delayed."]]},{"kind":"morning","heading":"AGE 1 | A year of small milestones","story":"Lui takes his first steps between the doorway and his mother's arms. He babbles at passing birds and reaches for anything colorful. His parents celebrate each new word, even as they plan their week around uncertain work.\n\nSome days his mother must leave early for a cleaning job. A relative watches him, but the family has no nearby childcare center. A fever means extra worry: care is available, yet reaching it takes fare and time away from work.\n\nLui's first steps happen while his mother is getting ready for work. She turns back when she hears him fall, then has to leave before the shift is given to someone else. That evening, she asks him to walk for her again, though he is too young to understand why she had to go.","options":[["Ask a relative to help with childcare and clinic visits.",{"Health":1,"Community":1},"Having someone trusted nearby eases the trip to the clinic. The relative also has needs of their own, so informal help cannot replace public childcare and health services."],["His mother misses a day of work to stay with him.",{"Health":1,"Family income":-1},"Lui gets the care and comfort he needs. The lost day's wages make the next grocery trip harder."]]},{"kind":"morning","heading":"AGE 1 | Finding dependable childcare","story":"When Lui is one, his mother is offered a short shift. She asks two neighbors whether they can watch him, but their own work schedules change too. Without dependable childcare, accepting work can mean risking unsafe care or turning down wages.","options":[["Use a community childcare group for the shift.",{"Family income":1,"Community":1},"Lui is watched in a shared, supervised space, and his mother can take the shift."],["His mother declines the shift and stays with him.",{"Health":1,"Family income":-1},"Lui is cared for by his mother, but the household loses the day's possible wages."]]},{"kind":"morning","heading":"AGE 1 | A fever in the night","story":"One night Lui develops a fever. His parents watch him closely and remember the clinic's advice. They have to decide whether to seek help immediately or wait until a health worker visits nearby.","options":[["Call the local health worker for advice.",{"Health":1,"Hope":1},"The worker explains warning signs and where to seek care, helping the family act sooner."],["His mother takes him to the clinic at first light.",{"Health":1,"Family income":-1},"A nurse checks Lui. His mother misses a morning of work, but the family gets medical advice."]]},{"kind":"morning","heading":"AGE 2 | Words, play, and a crowded home","story":"At two, Lui names familiar objects and imitates the sounds of tools his father uses. There are no picture books at home, so his mother tells stories she remembers. He loves playing outside, but the crowded yard leaves little room to explore.\n\nThe family is sharing a small home with a relative while they try to keep up with rent. Lui has affection and attention, but little quiet space and few toys made for learning.\n\nIn the crowded room, Lui falls asleep against his mother's shoulder while adults talk softly about rent. His father makes him a toy from a scrap of wood. Lui keeps it beside him, unaware that his parents have skipped their own meal to make his porridge thicker.","options":[["Borrow books and toys from a neighborhood lending shelf.",{"Learning":1,"Community":1},"Lui discovers new pictures and stories. The lending shelf is useful, although it is far away and does not have enough materials for every child."],["His parents make toys from safe household materials.",{"Hope":1,"Family income":1},"Lui plays with a small homemade drum. His parents can keep working, but the crowded home still limits space and rest."]]},{"kind":"morning","heading":"AGE 2 | Learning by copying","story":"Lui is two and copies the sweeping, cooking, and greetings he sees adults do. His family praises his questions, but the home is noisy and several people share one room. Quiet time for stories is rare when everyone is tired after work.","options":[["A caregiver sets aside time for songs and stories.",{"Learning":1,"Hope":1},"A daily story becomes a small routine that helps Lui learn new words."],["Lui spends the afternoon with cousins outdoors.",{"Community":1,"Health":1},"Playing with cousins gives him movement and companionship, though adults must keep an eye on the unsafe road nearby."]]},{"kind":"morning","heading":"AGE 2 | A household move","story":"The family moves in with a relative after rent rises. Lui is too young to understand why his sleeping place changes, but he notices familiar objects packed away. Sharing rent helps the adults, while crowding makes privacy and sleep harder for everyone.","options":[["The family asks a local group about housing support.",{"Community":1,"Hope":1},"They learn about a possible assistance program, though the waitlist is long."],["Stay with the relative and contribute through chores.",{"Family income":1,"Health":-1},"The family avoids a new rent bill, but adults and children have less space to rest."]]},{"kind":"morning","heading":"AGE 3 | Learning through play","story":"Lui is curious about the names of plants and the stories his mother tells. His father is still looking for steady work, and his mother takes occasional jobs. Sia has not been born yet.\n\nThere is no nearby preschool the family can afford. Lui learns at home, but his parents worry that he has fewer books, toys, and chances to play with other children.\n\nAt the play group, Lui learns a song about counting. On the weeks the group closes, he sings it at home and waits for his mother to join in after work. Some evenings she is too tired to finish the song; he sings the last line for both of them.","options":[["Join a free play-and-learning group at the community center.",{"Learning":1,"Community":1},"Lui meets other children and practices words and numbers through play. It helps, though it cannot replace reliable early-childhood services for every family."],["Stay with a trusted neighbor while his parents work.",{"Family income":1,"Hope":1},"His parents can take a short job. Lui is cared for by someone he knows, but the family still has little time and money for learning materials."]]},{"kind":"morning","heading":"AGE 3 | A morning in the play group","story":"At three, Lui learns a simple counting song and waits eagerly for his turn with the picture cards. The group is led by volunteers, so it sometimes starts late or closes. Lui likes the routine and asks at home when he can go again.","options":[["Help the center make a shared schedule for families.",{"Community":1,"Hope":1},"Families coordinate volunteer days, making the group more reliable for a while."],["Practice the counting song at home with his mother.",{"Learning":1},"The song becomes part of their evening routine even when Lui cannot attend the group."]]},{"kind":"morning","heading":"AGE 3 | When the group is closed","story":"One week the play group is locked because the volunteer is sick. Lui waits at the door with his mother. She cannot afford another program, and the missed visit means he spends the day accompanying her on errands instead.","options":[["Neighbors take turns hosting a small play circle.",{"Community":1,"Learning":1},"The children keep meeting, though the adults need continued support and safe space."],["Lui accompanies his mother to her work search.",{"Family income":1,"Learning":-1},"He sees how difficult finding work can be, but he misses a day of play and learning."]]},{"kind":"morning","heading":"AGE 4 | Getting ready for school","story":"At four, Lui draws roads in the dirt and says he will build a bridge one day. His mother encourages him, but she cannot afford preschool fees or the uniform required by one nearby program. A free program exists across town.\n\nHis parents compare the bus fare with the money needed for cooking fuel. Lui senses their concern when they talk quietly after he goes to bed, even if he does not understand the bills.\n\nLui draws a bridge and says he will build one so people can cross without getting their feet wet. His mother smiles and pins the drawing above the sleeping mat. The paper curls in the damp air, but she smooths it each morning before leaving for work.","options":[["A volunteer helps Lui join the free program across town.",{"Learning":1,"Community":1},"He enjoys songs and counting games. The commute is tiring, and his attendance depends on transport support continuing."],["Lui stays home and learns through errands with his mother.",{"Learning":1,"Family income":1},"He practices counting at the market and learns the names of vegetables. His mother can keep her work schedule, though Lui misses a regular group and classroom routine."]]},{"kind":"morning","heading":"AGE 4 | Learning the route","story":"Lui is four and knows the bus route to the free program by heart. He enjoys spotting familiar shops, but the family has to leave early and sometimes waits in the rain. A missed connection can mean arriving after the activities have started.","options":[["Ask the program about a transport pass.",{"Learning":1,"Hope":1},"A temporary pass helps Lui attend more consistently, but its renewal is uncertain."],["Walk part of the way to save bus fare.",{"Family income":1,"Health":-1},"The family saves some money, but the longer walk is tiring for Lui and his mother."]]},{"kind":"morning","heading":"AGE 4 | A drawing of a bridge","story":"Lui draws a bridge with bright blue water underneath. His teacher pins it to the wall and asks him to explain how people would cross. Lui talks confidently, then becomes quiet when the class discusses who can afford the program next term.","options":[["The teacher helps apply for a fee waiver.",{"Learning":1,"Community":1},"Lui can continue for another term while the family looks for more stable support."],["Bring the drawing home and show his parents.",{"Hope":1},"His parents celebrate his imagination, though they cannot promise that transport costs will be covered."]]},{"kind":"morning","heading":"AGE 5 | One year before school","story":"Lui can recognize a few letters and proudly writes the first letter of his name. A teacher says he is ready to learn, but school will require notebooks, shoes, and transport. His parents try to collect these items slowly.\n\nThe family needs to replace a cooking pot, so the small amount they saved for school supplies goes to the kitchen. Lui notices the alphabet book is put away while his parents work out what to pay first.\n\nThe night before school, his mother stitches a loose strap on a used bag. Lui pretends to be asleep so she will not see him watching. In the morning, he carries it carefully, proud of it and quietly worried that someone will notice the patch.","options":[["The school and neighbors organize a supplies exchange.",{"Learning":1,"Community":1},"Lui receives a used bag and notebooks. Reusing supplies helps, but it does not cover transport, meals, or the cost of replacing worn items."],["His parents take extra work to buy school supplies.",{"Family income":1,"Health":-1},"The bag and notebooks are ready. The long workdays leave his parents tired, and the roof still needs a better repair."]]},{"kind":"morning","heading":"AGE 5 | Preparing a school bag","story":"At five, Lui sorts his few pencils into a used bag. He practices putting it on and walking to the gate. The family still needs shoes that fit and money for notebooks, so his parents ask the school what is essential on the first day.","options":[["The school lends Lui shoes and starter materials.",{"Learning":1,"Hope":1},"He has what he needs to begin, and the school records which items will need replacement later."],["His parents buy one item at a time.",{"Family income":-1,"Learning":1},"Lui gets a notebook and pencils. The cost is manageable in small amounts but leaves less for other expenses."]]},{"kind":"morning","heading":"AGE 5 | The cooking pot","story":"The family's cooking pot cracks just before school starts. Without it, preparing porridge is difficult. The money set aside for Lui's notebooks and shoes is the only money they have until his father finds another job.","options":[["Use the savings to replace the pot.",{"Food":1,"Learning":-1},"The family can cook again, but Lui starts school with fewer supplies."],["Borrow a pot from a neighbor and keep the school money.",{"Learning":1,"Community":1},"Lui has his notebooks for school. His mother will return the pot when the family can afford a replacement."]]},{"kind":"morning","heading":"AGE 6 | The first day of school","story":"Lui starts school and is excited to read signs and write his name. The classroom is crowded, and the walk takes nearly an hour. Some days the family can pay for transport; other days he walks or arrives late.\n\nHis teacher sees that he is eager to learn. When the family has to choose between school costs and dinner, attendance becomes uncertain. Missing class is not a lack of interest.\n\nOn his first day, Lui keeps looking toward the gate after his mother leaves. He wants to learn the letters on the board, but he also wants her to come back before the final bell. At home, he tells her one new word and asks if she missed him too.","options":[["Go to school with the other children, even though the walk is long.",{"Learning":1,"Health":-1},"Lui makes it to class and enjoys walking with friends. By the time he arrives, he is already tired."],["Stay home to help his parents prepare goods for the market.",{"Family income":1,"Learning":-1},"Lui helps his parents get their goods ready. He misses class, but his teacher gives him the notes later."]]},{"kind":"morning","heading":"AGE 6 | Finding his classroom","story":"On his first school morning, Lui holds his mother's hand at the gate. He is excited by the chalkboard and nervous about where to sit. When the bell rings, his mother leaves for work, hoping the teacher will notice if he needs help.","options":[["The teacher pairs Lui with a welcoming classmate.",{"Learning":1,"Hope":1},"A classmate shows him where supplies are kept and helps him feel that he belongs."],["Lui watches quietly until he understands the routine.",{"Learning":1},"He learns the classroom routine by observing, but he hesitates to ask questions at first."]]},{"kind":"morning","heading":"AGE 6 | The cost of a school day","story":"Lui likes school, but the day also brings small costs: a snack, transport, and paper for assignments. His parents try to plan ahead, yet their income does not arrive on the same schedule as school expenses.","options":[["Use a school meal program when it is available.",{"Food":1,"Learning":1},"Lui is less distracted by hunger on program days, though coverage is not yet every day."],["Share supplies with a desk partner.",{"Community":1,"Learning":1},"The children help one another finish the work, but the classroom needs enough materials for everyone."]]},{"kind":"morning","heading":"AGE 7 | Learning to read","story":"Lui begins reading short stories aloud. At home, he likes making up new endings and telling them to his mother. At school, he shares a desk with another student and sometimes cannot see the board.\n\nHis teacher lends him a book to take home. There is no electric light in one room, so Lui reads near the doorway before sunset. When his father finds a short job, the household can buy a lamp bulb and more cooking oil.\n\nA friend lends Lui a storybook. He reads slowly, sounding out each word, and returns to the same page when the light fades. He wants to keep reading, but the book must go back tomorrow and there is no lamp oil to spare tonight.","options":[["Join an after-school reading circle with borrowed books.",{"Learning":1,"Community":1},"The reading circle gives Lui a quiet place and more books. He starts helping younger children sound out words."],["Help his father with a short job after class.",{"Family income":1,"Learning":-1},"Lui is proud to contribute, but he misses the reading circle and comes home too tired to finish his homework."]]},{"kind":"morning","heading":"AGE 7 | A new friend","story":"At seven, Lui becomes friends with a classmate who lends him storybooks. They trade favorite parts during lunch. Lui wants to invite the friend home, but he feels embarrassed about the crowded room and the leaking roof.","options":[["Invite the friend to read together at the library.",{"Learning":1,"Community":1},"They find a quiet place to read, and Lui feels more comfortable sharing his interests."],["Keep the friendship at school for now.",{"Hope":1},"Lui enjoys the friendship without worrying about hosting, though he still feels self-conscious about home."]]},{"kind":"morning","heading":"AGE 7 | A chance to help younger students","story":"The teacher asks Lui to help a younger student with letter sounds. Lui is patient and discovers that explaining a word helps him understand it too. At home, however, he is expected to finish chores before he can read.","options":[["Join the reading circle as a student helper.",{"Learning":1,"Hope":1},"Lui gains confidence and a little extra reading time after class."],["Finish chores first and read only if time remains.",{"Family income":1,"Learning":-1},"The household work gets done, but Lui has less time to practice and rest."]]},{"kind":"noon","heading":"AGE 8 | A week when food runs short","story":"Lui's father's temporary work has stopped, and there is little food left at home. His mother makes a thin porridge and tells the children to eat first. Lui knows she has not taken a bowl. At school, hunger makes it hard to follow the lesson.\n\nHe wants to help his parents, but he also wants to keep up with multiplication. His teacher notices the unfinished work but does not know what the family is facing.\n\nAt breakfast, Lui notices his mother has left her portion untouched beside the cooking pot. She says she will eat later. He carries the small extra piece of bread she gives him to school, then saves half of it for the walk home.","options":[["Go to class and quietly ask the teacher for help with lunch.",{"Learning":1,"Hope":1},"The teacher finds a meal for Lui that day. It eases his hunger, but the family still does not know what dinner will be."],["Stay home to help his mother prepare goods for the market.",{"Family income":1,"Learning":-1},"Lui helps his mother try to earn enough for food. He misses class, and the work may not bring in much."]]},{"kind":"noon","heading":"AGE 8 | A meal before class","story":"At eight, Lui's mother asks him to take the last piece of bread to school. He says he is not hungry, hoping she will eat it instead. She wraps it in paper and puts it in his bag anyway.","options":[["Eat the bread at school and focus on the lesson.",{"Food":1,"Learning":1},"Lui eats slowly and follows the lesson. At home, his mother says she had a meal, though the pot is still empty."],["Save half for his mother to eat later.",{"Food":1,"Hope":1},"Lui brings half the bread home for his mother. He is glad she has something to eat, then struggles to concentrate through the afternoon."]]},{"kind":"noon","heading":"AGE 8 | Returning to class","story":"Lui has to catch up on multiplication and reading after missing school. He compares himself with classmates and worries he has fallen behind. His teacher offers extra practice, but the session is at a time when Lui often helps fetch water.","options":[["The school offers a flexible catch-up time.",{"Learning":1,"Hope":1},"Lui attends a short session before class and rebuilds confidence."],["Practice at home with a borrowed workbook.",{"Learning":1,"Health":-1},"He improves, but studying late after chores makes him tired the next day."]]},{"kind":"noon","heading":"AGE 9 | A cough and the cost of care","story":"Lui misses several days of school with a persistent cough. The nearest clinic is far away, and the fare and medicine compete with rent and food. Their water source is sometimes unsafe; boiling water uses fuel they also need for cooking.\n\nHis mother asks a neighbor about a local clinic. The neighbor shares what they know, but the family must still decide how to reach care.\n\nAt night, his mother sits beside Lui and listens to his breathing. She tells him she is not worried, but keeps her hand on his back long after he falls asleep. In the morning she has to choose between another clinic trip and the work that pays for food.","options":[["A local health outreach team checks on Lui.",{"Health":1,"Community":1},"The team offers advice and helps the family find lower-cost care. Lui improves, but gaps in clean water and regular health services remain."],["His mother takes him to the clinic, using the week's travel money.",{"Health":1,"Family income":-1},"A nurse sees Lui and explains how to care for his cough. The trip helps, but the family has less money for other needs that week."]]},{"kind":"noon","heading":"AGE 9 | The clinic waiting room","story":"At nine, Lui sits with his mother among other families waiting to see a nurse. He is thirsty and tired from the trip. The clinic has limited staff, so the family waits most of the morning and his mother loses a day's pay.","options":[["A community fund helps cover transport and lost wages.",{"Health":1,"Community":1},"The family can complete the visit without choosing between the trip and dinner."],["Return home and try again on the next clinic day.",{"Family income":1,"Health":-1},"His mother returns to work, but Lui's care is delayed and the worry follows them home."]]},{"kind":"noon","heading":"AGE 9 | Safe water at home","story":"The neighbor shows the family how to treat water, but fuel is costly and the storage container has a cracked lid. Lui learns to cover it carefully. The family knows safe water matters, yet keeping it safe every day takes supplies and time.","options":[["A local program provides a covered water container.",{"Health":1,"Community":1},"The container helps protect drinking water, though reliable clean water access is still needed."],["Boil smaller amounts of water for drinking.",{"Health":1,"Family income":-1},"The family has safer drinking water for now, but fuel costs rise and the process takes time."]]},{"kind":"noon","heading":"AGE 10 | Schoolwork after the household chores","story":"Lui is ten and often helps fetch water before school. On days when the water point is busy, he arrives after the first lesson. He has learned to plan his route, but the responsibility still takes time and energy.\n\nA class project asks students to bring materials from home. Lui worries that he cannot contribute. His friend shares paper with him, and together they make a poster about clean water.\n\nLui wakes before dawn to fetch water. On the path back, he practices spelling words in his head so he will not forget them before class. When he arrives tired, he hides his yawn behind his hand and hopes the teacher will not ask him to read aloud.","options":[["Ask the school to make project materials available to everyone.",{"Learning":1,"Community":1},"The teacher starts a shared supplies box. Lui can take part without asking his family to buy extra materials."],["Wake earlier to fetch water before the queue forms.",{"Family income":1,"Health":-1},"Lui is on time for class more often, but waking before dawn leaves him tired and cuts into sleep."]]},{"kind":"noon","heading":"AGE 10 | A school project about water","story":"At ten, Lui's class investigates how far families travel for water. Lui shares what he knows, then notices some classmates have taps at home. He wonders why a basic need is so different from one household to another.","options":[["Present the class findings to the school council.",{"Learning":1,"Community":1},"The council discusses water access with local leaders and families."],["Make a map of water points with classmates.",{"Learning":1,"Hope":1},"The map helps students plan safer routes and identify places where service is unreliable."]]},{"kind":"noon","heading":"AGE 10 | Too much to carry","story":"The water containers feel heavier as Lui grows, but he now carries more than he did when he was younger. Some days he arrives at school with sore shoulders. He does not want to complain because his mother is already managing many responsibilities.","options":[["A neighbor group organizes a shared water schedule.",{"Health":1,"Community":1},"The burden is shared more fairly for a while, though a dependable nearby water supply is still the lasting need."],["Lui continues the route before school.",{"Family income":1,"Health":-1},"The household has water, but Lui begins class tired and has less energy for sports."]]},{"kind":"noon","heading":"AGE 11 | A year of change at home","story":"Lui's father finds temporary work, then loses it when the project ends. The uncertainty makes it hard to plan school expenses. Lui does well in science and likes taking apart broken objects to see how they work.\n\nHe wants to join a school club, but meetings happen after class and transport home is not always available. He tells his teacher he is busy, rather than explaining the cost and distance.\n\nLui draws the bridge again, this time adding a classroom on higher ground. He folds the page into his notebook when his father says the family may have to move if work does not return. Lui does not ask where they would go; he asks whether he can take the drawing.","options":[["The teacher helps arrange a safe ride home after club meetings.",{"Learning":1,"Hope":1},"Lui joins the science club and repairs a small radio with classmates. A practical transport plan opens an opportunity that was out of reach."],["Save the fare and go straight home to help his family.",{"Family income":1,"Learning":-1},"Lui helps prepare for his father's next job. He keeps learning from broken objects at home, but misses the club and mentorship."]]},{"kind":"noon","heading":"AGE 11 | A science-club project","story":"At eleven, Lui builds a small paper model of a water pump. He wants to join the science club, but the meeting ends after the last affordable bus. His teacher sees his talent and asks what would make attendance possible.","options":[["The school arranges a supervised late bus.",{"Learning":1,"Community":1},"Lui joins the club and learns from classmates who share his interest."],["Borrow the club kit and work at home.",{"Learning":1,"Hope":1},"He can experiment at home, though he misses feedback and access to specialized tools."]]},{"kind":"noon","heading":"AGE 11 | Temporary work ends again","story":"His father's temporary job ends just as the family planned for a school expense. Adults discuss bills late at night. Lui hears the tension and tries not to ask for anything, even when his school shoes split at the sole.","options":[["A school social worker helps find emergency support.",{"Hope":1,"Community":1},"The family learns about a small emergency fund and repair service."],["Patch the shoes and wait until the next job.",{"Family income":1,"Health":-1},"The shoes last a little longer, but Lui worries about being teased and the repair is not permanent."]]},{"kind":"noon","heading":"AGE 12 | Sia is born","story":"Sia is born when Lui is twelve. His parents love both children, but the household budget is stretched. Lui starts helping with meals and caring for Sia. He likes being her big brother, yet some afternoons he misses homework or school activities.\n\nHis teacher notices that Lui is quieter and asks what might help. Lui wants to keep learning without leaving his family alone with its responsibilities.\n\nWhen Sia is born, Lui holds her carefully and whispers that he will teach her the counting song. Later, he hears her crying while his mother tries to rest. He gets up to rock her, then arrives at school with his homework unfinished.","options":[["The teacher helps apply for school meals and family support.",{"Food":1,"Learning":1,"Hope":1},"The school helps with the forms. If support is approved, Lui may have more time for class and homework."],["Lui takes on more childcare while his mother works.",{"Family income":1,"Learning":-1},"His mother can accept more hours. Lui is proud to help, though he falls behind in class and has less time to rest."]]},{"kind":"noon","heading":"AGE 12 | Learning to be a big brother","story":"At twelve, Lui is proud when Sia grips his finger. He sings to her and fetches clean cloths. Their parents are grateful, but Lui sometimes starts homework late after helping with dinner and settling the baby.","options":[["A relative takes one evening of childcare each week.",{"Learning":1,"Community":1},"Lui gets a regular study evening while the relative shares the care."],["Lui studies beside Sia while she sleeps.",{"Hope":1,"Health":-1},"He keeps up with some work, but poor sleep makes school harder the next day."]]},{"kind":"noon","heading":"AGE 12 | A meeting with the teacher","story":"The teacher asks Lui privately how school feels. Lui explains that he likes science but worries about his mother doing too much. The teacher listens without blaming him and describes meal support and family services.","options":[["Let the teacher help the family contact a support worker.",{"Food":1,"Hope":1},"The family gets clear information and begins an application. It may take time for support to arrive."],["Keep the family's struggles private for now.",{"Family income":1,"Learning":-1},"Lui avoids an uncomfortable conversation, but continues carrying the responsibilities alone."]]},{"kind":"noon","heading":"AGE 13 | The pressure to earn","story":"At thirteen, Lui is taller and more independent. He can repair a neighbor's bicycle and is sometimes paid for small jobs. The money helps buy food, but customers call during school hours too.\n\nLui wants to save for a school trip where students visit a technical college. He calculates the cost carefully and wonders whether it is fair to ask his family for money when Sia needs clothes and medicine.\n\nAt the technical college, Lui touches the cool metal of an engine and imagines learning how to repair it. On the ride home, he keeps the brochure folded in his pocket. He does not show it to his mother until he knows how much the application costs.","options":[["Ask the teacher about a fee waiver for the school trip.",{"Learning":1,"Hope":1},"The teacher explains how to apply. Lui may be able to join the visit if the fee support comes through; training will still depend on costs and opportunities."],["Take more repair jobs and save the money himself.",{"Family income":1,"Learning":-1},"Lui saves part of his earnings. He has less time for homework and cannot accept every job without missing class."]]},{"kind":"noon","heading":"AGE 13 | First paid repair","story":"At thirteen, Lui repairs a bicycle chain for a neighbor and receives a small payment. He likes solving the problem. The neighbor asks him to come back during school hours next time, and Lui has to explain that he cannot always do that.","options":[["Agree on work only after school and on safe terms.",{"Family income":1,"Learning":1},"Lui earns a little while protecting class time. Safe, fair work boundaries matter even for small jobs."],["Take the daytime job because the family needs money.",{"Family income":1,"Learning":-1},"The money helps right away, but Lui misses a lesson and risks losing ground in school."]]},{"kind":"noon","heading":"AGE 13 | A technical college brochure","story":"A teacher brings a brochure from a technical college to class. Lui studies the pictures of engines and workshops, imagining what it would be like to learn there. A visit is being planned, but the fee and transport costs may keep him from going. Even applying later will require documents and travel.","options":[["Ask the counselor to explain scholarships and requirements.",{"Learning":1,"Hope":1},"Lui gets a list of steps and deadlines, making the goal feel more understandable."],["Focus on earning for his family this month.",{"Family income":1,"Learning":-1},"Lui helps with current expenses but postpones asking about future training."]]},{"kind":"noon","heading":"AGE 14 | Studying through uncertainty","story":"The family moves to a smaller home after rent rises. Lui changes schools and has to learn a new route, new classmates, and a different schedule. He keeps his old notebooks in a box and tries to catch up on lessons.\n\nA counselor tells him that students who move often can ask for records to be transferred. Lui is relieved, but some books and assignments are missing, and the family has no internet at home.\n\nThe move happens quickly. Lui leaves behind a friend, a familiar path to school, and the place where his bridge drawing had hung. He carries the notebook under his shirt to keep it dry. At the new school, he says he is fine because he does not know how to explain what he misses.","options":[["Use the school library and ask for help transferring records.",{"Learning":1,"Community":1},"The library gives Lui a place to study and access to reference books. His new teacher helps recover some missed work."],["Study from a classmate's notes after finishing chores.",{"Learning":1,"Health":-1},"Lui catches up on several lessons. Late nights leave him exhausted, and he still lacks reliable access to books and internet."]]},{"kind":"noon","heading":"AGE 14 | Starting over at a new school","story":"At fourteen, Lui introduces himself to a new class after his family moves. He misses his old friends and is unsure which teacher to ask for help. The new school uses different books, so familiar topics appear in a different order.","options":[["A counselor reviews his school records with him.",{"Learning":1,"Hope":1},"The counselor helps identify what Lui has already learned and what support he needs next."],["Copy notes from a classmate and catch up alone.",{"Learning":1,"Health":-1},"Lui fills some gaps but stays up late and does not know whether he missed important material."]]},{"kind":"noon","heading":"AGE 14 | No internet for homework","story":"A homework assignment asks students to research careers online. Lui can use a phone only when his father returns from work, and the data plan is nearly empty. The school library has a few computers, but they close before his chores are finished.","options":[["The teacher provides printed research materials.",{"Learning":1,"Community":1},"Lui can complete the assignment without needing a device or data."],["Use a friend's phone and share the data cost.",{"Learning":1,"Family income":-1},"Lui finishes the work, but the family contributes to the data charge and still lacks regular access."]]},{"kind":"evening","heading":"AGE 15 | Work, school, and rising food costs","story":"Lui is good at repairing bicycles and dreams of studying engineering. His father's temporary work is interrupted, and the price of food keeps rising. When money runs short, Lui takes paid jobs after school.\n\nSome weeks he studies late; some weeks he misses class. He is capable and determined, but determination cannot create steady work, affordable transport, or enough hours in a day.\n\nA mechanic lets Lui watch him work and calls him careful with his hands. Lui remembers the praise for days. He still takes evening jobs when the family needs money, and the grease under his nails does not wash away before school the next morning.","options":[["A youth program offers tutoring and a transport stipend.",{"Learning":1,"Hope":1,"Community":1},"Lui stays in school and meets a mentor. He begins to imagine a path toward technical training, though the future is still uncertain."],["Take more repair work to help pay household bills.",{"Family income":1,"Learning":-1,"Health":-1},"Lui's skills bring in money for the family. Long hours leave him exhausted and make it harder to keep up with school."]]},{"kind":"evening","heading":"AGE 15 | A mentor talks about safe work","story":"At fifteen, Lui's mentor explains that a good job is not only a paycheck: it should also be safe, fairly paid, and compatible with learning. Lui compares that with some repair jobs where the hours are long and the tools are worn.","options":[["Ask the youth program about a supervised apprenticeship.",{"Learning":1,"Hope":1},"Lui learns about a safer training placement and applies for an interview."],["Keep taking informal repair work for quick cash.",{"Family income":1,"Health":-1},"The family receives money sooner, but the work remains unpredictable and sometimes unsafe."]]},{"kind":"evening","heading":"AGE 15 | A month without steady work","story":"Lui's father's temporary jobs have stopped. He visits the market each morning asking for work and returns home with the same worn tools. The family starts measuring food carefully, unsure how long the gap will last.","options":[["Share job leads with neighbors and look together.",{"Community":1,"Family income":1},"His father finds a few days of work. It helps with food, but there is no promise of another shift."],["Lui takes evening shifts at the repair stall.",{"Family income":1,"Health":-1},"The household has a little more money for food, but Lui sleeps less and struggles to concentrate in class."]]},{"kind":"evening","heading":"AGE 16 | Choosing a path after school","story":"At sixteen, Lui is preparing for exams while helping his mother care for Sia. He enjoys practical science and wants to train as a mechanic or engineer. The application forms ask for documents, fees, and travel to a town several hours away.\n\nA mentor explains scholarship options, but deadlines are close. Lui must balance studying, paid work, and the time needed to gather papers. None of these choices changes the fact that the family needs reliable income and care.\n\nAt sixteen, Lui studies while Sia sleeps beside him. His mother leaves a cup of water near the notebook and says she believes he can pass. He wants to believe her, but the exam date is close and the transport money is not yet there.","options":[["Ask the mentor to help with forms and a scholarship application.",{"Learning":1,"Hope":1},"Lui submits the application on time. He has a chance to continue studying, but admission and funding are not guaranteed."],["Work more hours and postpone the application.",{"Family income":1,"Learning":-1},"The wages help with immediate bills. Lui postpones training and worries that the opportunity may not return."]]},{"kind":"evening","heading":"AGE 16 | Exam preparation","story":"At sixteen, Lui studies for exams in short bursts between chores and work. He knows the material but worries about the exam fee and getting to the testing center. Missing the exam could close a path to further study.","options":[["Ask the school for help with the exam fee and transport.",{"Learning":1,"Hope":1},"A teacher helps Lui apply for support so he can sit the exam."],["Help his parents after school and study with free materials at night.",{"Family income":1,"Learning":-1},"Lui helps with household costs and reviews his notes later, but he has less time to prepare."]]},{"kind":"evening","heading":"AGE 16 | Talking about the future","story":"Lui and his mother talk about what he wants after school. She hopes he can study, while also worrying about bills and her health. Lui does not want her to feel guilty for a choice shaped by limited options.","options":[["Make a plan with a counselor and family support worker.",{"Hope":1,"Community":1},"The adults help identify training, health, and financial supports that could make several paths possible."],["Keep the plan private until he knows his exam results.",{"Learning":1},"Lui focuses on the next test, but the family has less time to prepare for applications and costs."]]},{"kind":"evening","heading":"AGE 17 | Looking toward adulthood","story":"Lui is finishing secondary school when he can. He has learned to repair engines and still hopes to continue his education. His father has irregular work, and his mother is unwell. Lui considers a training scholarship, but it requires documents, travel, and time away from paid work.\n\nHe talks with a teacher and community worker about what might be possible. His future should not depend on one teenager solving problems created by poverty.\n\nAt seventeen, Lui writes three futures on the last clean page of his notebook: training, an apprenticeship, work. Underneath, he writes Sia's name and a promise to help her stay in school. He does not know which plans the family will be able to keep.","options":[["Apply for training with help from his teacher.",{"Learning":1,"Hope":1},"The teacher helps gather documents and find transport. Lui submits the application. It is an opportunity, not a guarantee; the family still needs dependable services and income."],["Take a full-time job now to support his family.",{"Family income":1,"Learning":-1,"Health":-1},"The wages help with immediate bills. Lui postpones training, carrying both pride in helping and worry about what he has had to give up."],["Meet with neighbors to ask for health and social support.",{"Community":1,"Hope":1},"Neighbors help the family find local services. Shared support eases some pressure, while larger barriers need lasting public action."]]},{"kind":"evening","heading":"AGE 17 | Waiting for an answer","story":"At seventeen, Lui has submitted a training application and checks for a response whenever he can. The wait is difficult because the family still needs income now. He keeps repairing engines and helps Sia with schoolwork, imagining what he might study.","options":[["A mentor helps Lui plan for more than one outcome.",{"Hope":1,"Learning":1},"Lui prepares an alternate training route and a work plan, so one decision does not define his entire future."],["Take any available job while waiting.",{"Family income":1,"Health":-1},"The family gets immediate support, though Lui becomes more tired and has less time to follow up on the application."]]},{"kind":"evening","heading":"AGE 17 | A family illness","story":"Near the end of the year, Lui's mother becomes seriously ill. The family tries to reach care, but the nearest clinic is far away and transport costs money they do not have. Lui is frightened and tries to stay calm for Sia.","options":[["A neighbor helps arrange urgent transport and contacts the clinic.",{"Community":1,"Health":1},"The community response brings the family closer to care, but the illness and financial strain remain serious."],["Lui goes to find paid work for the transport fare.",{"Family income":1,"Health":-1},"He finds a small amount of money, but the delay weighs on the family and care is still difficult to reach."]]}];

 const person=(x,y,ht,shirt='#4f796d',small=false)=>{let head=small?15:Math.max(12,ht*.13), hy=y-ht+head+4,sy=hy+head+9,waist=y-(ht>100?44:32),sh=small?22:Math.max(15,ht*.15);return `<ellipse cx="${x}" cy="${y+2}" rx="23" ry="6" fill="#403b32" opacity=".35"/><circle cx="${x}" cy="${hy}" r="${head}" fill="#754632" stroke="#4f342c" stroke-width="2"/><path d="M${x-head} ${hy}q${head} -${head+9} ${head*2} 0" fill="none" stroke="#2f2927" stroke-width="6"/><path d="M${x-sh} ${sy}q${sh/2} -9 ${sh} 0l${sh-5} ${waist-sy}h-${sh*2-10}Z" fill="${shirt}" stroke="#3e5d52" stroke-width="3"/><path d="M${x-sh+5} ${sy+6}l-9 31m${sh*2-10} -31 9 31M${x-8} ${waist}l-4 30m20-30 4 30" stroke="#754632" stroke-width="8" stroke-linecap="round"/><path d="M${x-17} ${y}h12m8 0h12" stroke="#332d29" stroke-width="5" stroke-linecap="round"/>`};
 let people=kind==='tragedy'?'<g><path d="M470 55l12 32 34 1-27 20 10 33-29-19-29 19 10-33-27-20 34-1Z" fill="#fff0bd"/><text x="470" y="171" fill="#fff4dc" text-anchor="middle" font-family="Arial" font-weight="bold">LUI</text></g>':kind==='end'?'<g fill="#fff4dc" text-anchor="middle" font-family="Arial" font-weight="bold"><text x="720" y="110" font-size="34">LUI\'S STORY</text><text x="720" y="145" font-size="16">ONE LIFE, ONE COMMUNITY</text><circle cx="720" cy="190" r="14"/></g>':age<=2?person(287,278,146,'#a95f4a',true)+person(390,278,158,'#5f7d68',true):person(300,278,Math.min(158,82+age*4),age<6?'#bd714f':age<14?'#4f796d':'#496c70')+(age>=12&&['home','market','clinic'].includes(act)?person(465,278,76+Math.max(0,age-12)*4,'#d19a60',true):'');
 const stars=night?'<g fill="#f8edcf"><circle cx="840" cy="48" r="3"/><circle cx="934" cy="86" r="2"/><circle cx="1090" cy="52" r="3"/><circle cx="620" cy="90" r="2"/></g>':'<circle cx="1110" cy="68" r="42" fill="#f7d68e" stroke="#f8e8bc" stroke-width="3"/>';

function render(){
 $('choices').replaceChildren();
 const start=step<0,tragic=step>=SCENES.length&&!ending,reflection=step>=SCENES.length&&ending;
 $('art').innerHTML=art(start?'start':tragic?'tragedy':reflection?'end':SCENES[step].kind,start?'':reflection?'':tragic?'':SCENES[step].heading);
 $('progress').style.width=`${start?0:reflection?100:tragic?100:(step+1)/SCENES.length*100}%`;
 $('response').textContent=response;
 if(start){$('counter').textContent='A choice-based story';$('title').textContent='Service Project, 1324 Park Yuyeon';$('story').textContent='Follow Lui from birth to age 17 in a community near Bor, Jonglei State. His story follows the daily pressure of too little food, costly trips to school and clinics, limited public services, and work that is never guaranteed.\n\nMake choices about school, food, health, work, and family responsibilities. Each choice has limits, and no single child can solve poverty alone.';$('prompt').textContent='Ready to begin?';$('status').innerHTML='<span>A family relies on seasonal work and small market trade. Their circumstances change from year to year.</span>';button('Start the story',startStory,true);return}

function button(text,fn,primary=false){const b=document.createElement('button');b.className='choice'+(primary?' primary':'');b.textContent=text;b.onclick=fn;$('choices').append(b)}
function linkButton(text,url){const b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>window.open(url,'_blank','noopener');$('choices').append(b)}
function choose(effect,result){for(const [k,v] of Object.entries(effect)){if(k==='Community')community=Math.max(0,Math.min(3,community+v));else stats[k]=Math.max(0,Math.min(5,(stats[k]||0)+v))}step++;response=result;render()}
function startStory(){step=0;response='';render()}function restart(){stats={...initial};community=0;step=-1;response='';ending=false;render()}

</script><script>
// End-of-story sequence for the standalone web build.
(function () {
  let endingStage = 0;
  let estimateTimer = null;

  const estimateSource = 'https://www.oxfam.de/system/files/documents/methodology_note_inequality_kills.pdf';
  const unicefAppeal = 'https://www.unicef.org/appeals/south-sudan';
  const wfpAppeal = 'https://www.wfp.org/emergencies/south-sudan-emergency';

  const addDarkStyles = () => {
    if (document.getElementById('ending-dark-styles')) return;
    const style = document.createElement('style');
    style.id = 'ending-dark-styles';
    style.textContent = `
      body.dark{background:#07080b;color:#f4f1e9}
      body.dark .brand,body.dark .small,body.dark .footer{color:#aeb3bb}
      body.dark .art{background:#07080b;box-shadow:none}
      body.dark .card{background:#07080b;border-color:#272a30;box-shadow:none;color:#f4f1e9}
      body.dark .story{color:#d0d2d6}
      body.dark .status{border-color:#30343a;color:#aeb4bd}
      body.dark .progress{background:#23262c}
      body.dark .choice{background:#15181d;color:#f3f0e9;border-color:#3a3e45}
      body.dark .choice:hover,body.dark .choice:focus-visible{background:#232830;border-color:#87958d}
      body.dark .choice.primary{background:#477c64;border-color:#477c64;color:white}
      .rate-number{font:700 80px Arial,sans-serif;letter-spacing:-.06em}
      .rate-caption{font:500 21px Arial,sans-serif;fill:#d2d5da}
      .rate-sub{font:16px Arial,sans-serif;fill:#9299a4}
      @media(max-width:620px){.rate-number{font-size:70px}.rate-caption{font-size:18px}.rate-sub{font-size:14px}}
    `;
    document.head.append(style);
  };

  function endingArt(mode) {
    if (mode === 'rate') {
      return '<svg viewBox="0 0 1440 300" role="img" aria-label="A global estimate: 0.25 deaths per second"><rect width="1440" height="300" fill="#07080b"/><text x="720" y="86" text-anchor="middle" fill="#aeb4bd" font-family="Arial" font-size="16" font-weight="700" letter-spacing="4">A GLOBAL ESTIMATE</text><text x="720" y="184" text-anchor="middle" class="rate-number" fill="#f7f4ed">0.25</text><text x="720" y="229" text-anchor="middle" class="rate-caption">deaths linked to inequality-related causes per second</text><text x="720" y="267" text-anchor="middle" class="rate-sub">about one person every four seconds</text></svg>';
    }
    return '<svg viewBox="0 0 1440 300" role="img" aria-label="Official ways to support children in South Sudan"><rect width="1440" height="300" fill="#07080b"/><circle cx="720" cy="88" r="36" fill="none" stroke="#73917d" stroke-width="3"/><path d="M720 111s-32-19-32-39a18 18 0 0 1 32-11 18 18 0 0 1 32 11c0 20-32 39-32 39Z" fill="#73917d"/><text x="720" y="172" text-anchor="middle" fill="#f4f1e9" font-family="Arial" font-size="25" font-weight="700">WAYS TO SUPPORT CHILDREN</text><text x="720" y="210" text-anchor="middle" fill="#c5c9ce" font-family="Arial" font-size="17">South Sudan · Official organization appeals</text></svg>';
  }

  function setDark(active) {
    addDarkStyles();
    document.body.classList.toggle('dark', active);
  }

  window.render = function () {
    if (estimateTimer) {
      clearInterval(estimateTimer);
      estimateTimer = null;
    }
    $('choices').replaceChildren();
    const start = step < 0;
    const ending = step >= SCENES.length;
    const tragic = ending && endingStage === 0;
    const rate = ending && endingStage === 1;
    const donation = ending && endingStage === 2;
    const reflection = ending && endingStage >= 3;
    setDark(rate || donation);
    $('progress').style.width = (start ? 0 : ending ? 100 : (step + 1) / SCENES.length * 100) + '%';
    $('response').textContent = response;

    if (start) {
      $('art').innerHTML = art('start');
      $('counter').textContent = 'A choice-based story';
      $('title').textContent = 'Service Project, 1324 Park Yuyeon';
      $('story').textContent = 'Follow Lui from birth to age 17 in a community near Bor, Jonglei State. His story follows the daily pressure of too little food, costly trips to school and clinics, limited public services, and work that is never guaranteed.\n\nMake choices about school, food, health, work, and family responsibilities. Each choice has limits, and no single child can solve poverty alone.';
      $('status').innerHTML = '<span>A family relies on seasonal work and small market trade. Their circumstances change from year to year.</span>';
      $('prompt').textContent = 'Ready to begin?';
      button('Start the story', startStory, true);
      return;
    }

    if (tragic) {
      $('art').innerHTML = art('tragedy');
      $('counter').textContent = 'THE END';
      $('title').textContent = 'Lui, too, became a star because of poverty.';
      $('story').textContent = 'Shortly after turning 17, Lui becomes seriously ill with an infection. His family tries to get him treated, but the clinic has limited supplies, and the cost of transport, medicine, and missed work is more than they can manage. They ask for help and do what they can, yet treatment comes too late. Lui dies quietly, without a graphic scene.\n\nThis is not the result of one choice the player made. It is the result of needs his family could not reliably afford to meet: timely health care, medicine, enough food, and dependable support.';
      $('status').innerHTML = '';
      $('prompt').textContent = 'Take a moment, then continue.';
      button('Continue', () => { endingStage = 1; render(); }, true);
      return;
    }

    if (rate) {
      $('art').innerHTML = endingArt('rate');
      $('counter').textContent = 'A GLOBAL ESTIMATE';
      $('title').textContent = 'Beyond Lui’s story';
      $('story').textContent = 'This is an estimate, not a live global count. Oxfam’s 2022 report estimated at least 21,318 deaths a day linked to inequality-related causes, including unequal access to healthcare, hunger, gender-based violence, and climate impacts. The estimate combines data from different years; it does not mean poverty alone is the direct cause of every death.';
      const openedAt = Date.now();
      const updateEstimate = () => {
        const estimate = ((Date.now() - openedAt) / 1000 * 0.25).toFixed(2);
        $('status').textContent = 'Estimated deaths linked to inequality-related causes since this screen opened: ' + estimate;
      };
      updateEstimate();
      estimateTimer = setInterval(updateEstimate, 250);
      $('prompt').textContent = 'The rate comes from a 2022 report; it is not a live measurement.';
      linkButton('Read Oxfam’s methodology note', estimateSource);
      button('Continue to donation options', () => { endingStage = 2; render(); }, true);
      return;
    }

    if (donation) {
      $('art').innerHTML = endingArt('donation');
      $('counter').textContent = 'WAYS TO HELP';
      $('title').textContent = 'If you want to help';
      $('story').textContent = 'These links lead to official organization pages about their South Sudan work. Any donation is completed on that organization’s website; this game does not collect payment information.';
      $('status').textContent = 'You can continue without donating.';
      $('prompt').textContent = 'Choose an organization or continue to the reflection.';
      linkButton('UNICEF South Sudan Appeal', unicefAppeal);
      linkButton('World Food Programme: South Sudan Emergency', wfpAppeal);
      button('Continue to reflection', () => { endingStage = 3; render(); }, true);
      return;
    }

    $('status').innerHTML = Object.entries(stats).map(([k,v]) => '<span class="stat"><b>' + esc(k) + '</b><span class="dots">' + '●'.repeat(v) + '○'.repeat(5-v) + '</span></span>').join('') + (reflection ? '<span class="stat"><b>Community support shared</b><span class="dots">' + community + '</span></span>' : '');
    if (reflection) {
      $('art').innerHTML = art('end');
      $('counter').textContent = 'REFLECTION';
      $('title').textContent = 'What should have been different?';
      $('story').textContent = 'Lui’s story ends, but the choices around him remain. He wanted to learn, care for his family, and keep a promise to Sia. Too often, the family had to choose which need could wait.\n\nWhich part of Lui’s life stayed with you? What support could have changed the choices available to him before it was too late?';
      $('prompt').textContent = 'Think about it: What support would give Lui and his family more choices?';
      linkButton('UNICEF South Sudan: child and family survey','https://www.unicef.org/southsudan/press-releases/new-national-survey-shows-serious-challenges-children-south-sudan-also-clear-areas');
      linkButton('World Food Programme: South Sudan emergency',wfpAppeal);
      linkButton('World Bank: Poverty and basic services in South Sudan','https://www.worldbank.org/en/news/press-release/2024/12/10/new-report-reveals-that-poverty-and-vulnerability-remain-endemic-in-afe-south-sudan');
      button('Play again', restart);
      return;
    }

    const scene = SCENES[step];
    $('art').innerHTML = art(scene.kind, scene.heading);
    $('counter').textContent = (step + 1) + ' / ' + SCENES.length;
    $('title').textContent = scene.heading;
    $('story').textContent = scene.story + (response ? '\n\n' + response : '');
    const age = +(scene.heading.match(/AGE (\d+)/) || [])[1] || 0;
    $('prompt').textContent = age < 6 ? 'How should Lui’s family care for him? Each choice brings different help and challenges.' : 'What should Lui do now? Go to school, help at home, or ask for support.';
    scene.options.forEach(([label,effect,result],i) => button((i + 1) + '.  ' + label, () => choose(effect,result)));
  };

  window.startStory = function () { step = 0; response = ''; render(); };
  window.restart = function () { stats = {...initial}; community = 0; step = -1; response = ''; endingStage = 0; render(); };
  render();
})();

</script></body></html>
